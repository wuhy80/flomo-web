# Build the web app and publish it to GitHub Pages.
#
# Only the shell is published. It contains no notes: the vault lives encrypted
# in a separate private repository, and the key is derived from a password in
# the browser. So this workflow's output is safe to serve publicly.
#
# Note that this deploys the *web app*. The DeepSeek Harness plugin is not
# published anywhere — it is built locally and linked into a DSH profile.

name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build

      # A build can succeed and still produce a dist/ a browser cannot use: an
      # asset URL that resolves to nothing, a service worker that was never
      # copied, an absolute path that breaks under a project subpath. This serves
      # the output the way Pages does and checks what comes back, so a broken
      # deploy fails here instead of in someone's browser.
      - run: pnpm smoke

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
